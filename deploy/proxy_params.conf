# Shared reverse-proxy headers, included by every /agno/, /mcp/, /knowledge/
# location block in nginx.conf.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# SSE / streaming endpoints (/chat/stream, /workflows/{id}/run/stream,
# /runs/{id}/stream) need buffering disabled to flush chunks immediately.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Large file uploads (POST /documents/upload)
client_max_body_size 50m;